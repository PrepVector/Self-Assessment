# ─────────────────────────────────────────────────────────────────────────────
# docker-compose for the PrepVector backend.
#
# Usage:
#   docker compose up --build          # build + run
#   docker compose up -d               # run detached
#   docker compose down                # stop + remove
#
# Secrets are injected at runtime from the root .env (never baked into the image).
# Runtime output (CSV log + generated PDFs) is persisted to the host via mounts
# so it survives container restarts.
#
# NOTE: GEMINI_API_KEY MUST be set to a valid, non-empty key in .env. The app
# constructs the Gemini client at import time, so an empty key makes the
# container exit immediately on startup.
# ─────────────────────────────────────────────────────────────────────────────
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # Extra build context so the Dockerfile can copy the report template,
      # which lives outside ./backend (report_writer reads /report_reference).
      additional_contexts:
        report_reference: ./report_reference
    image: prepvector-backend:latest
    container_name: prepvector-backend
    ports:
      - "8000:8000"
    # Load GEMINI_API_KEY, SMTP_*, SPREADSHEET_ID, GOOGLE_CREDENTIALS_B64, etc.
    # from the root env file.
    #
    # GOOGLE_CREDENTIALS_B64 = base64 of the service-account credentials.json.
    # The image's entrypoint decodes it to /app/credentials.json at container
    # start, so no credentials file is needed on the host. Generate it with:
    #   base64 -i backend/credentials.json | tr -d '\n'
    env_file:
      - ./.env
    volumes:
      # Persist CSV assessment logs across container restarts.
      - ./backend/data:/app/data
      # Persist generated PDF reports.
      - ./generated_reports:/app/generated_reports
    restart: unless-stopped
    networks:
      - komodo_default

networks:
  komodo_default:
    external: true
